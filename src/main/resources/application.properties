# Server Configuration
server.port=8080

# Database Configuration (PostgreSQL)
# IMPORTANT: Replace placeholders with your actual PostgreSQL credentials
spring.datasource.url=jdbc:postgresql://localhost:5432/online_banking_db
spring.datasource.username=postuser
spring.datasource.password=12345
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA/Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Default Spring Security user (for initial testing, will be replaced by DB users)
# spring.security.user.name=user
# spring.security.user.password=password

# JWT Configuration (Placeholders - replace with secure values)
jwt.secret=YourVerySecretKeyNeedsToBeLongAndSecureEnough # Replace with a strong, secure secret key
jwt.expiration.ms=86400000
